<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Reset your password for NEXAStudios™ Music." />
    <title>Reset Password | NEXAStudios™ Music</title>
    <link rel="icon" type="image/png" href="/assets/nexa-mark.png" />
    <link rel="stylesheet" href="/styles.css?v=12" />
  </head>
  <body>
    <header class="site-header" id="top">
      <a class="brand" href="/" aria-label="NEXAStudios™ Music home">
        <img src="/assets/nexa-mark.png" alt="" />
        <span>NEXAStudios™ Music</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
        <span></span>
        <span></span>
      </button>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/artists">Artists</a>
        <a href="/studio">Studio</a>
        <a href="/store">Store</a>
        <a href="/blog">Blog</a>
        <a href="/contact">Contact</a>
        <a href="/auth">Sign In</a>
        <a href="https://www.youtube.com/@NEXAStudiosTMMusic" target="_blank" rel="noopener">YouTube</a>
      </nav>
    </header>

    <main>
      <section class="page-hero reveal">
        <div>
          <p class="eyebrow">Account</p>
          <h1>Reset your password</h1>
          <p>Enter your email to receive a password reset link.</p>
        </div>
        <img src="/assets/nexa-mark.png" alt="NEXAStudios™ Music mark" />
      </section>

      <section class="section page-section reveal">
        <div class="auth-container">
          <div class="auth-tabs">
            <button class="auth-tab active" data-tab="request">Request Reset</button>
            <button class="auth-tab" data-tab="confirm">Enter Token</button>
          </div>

          <form class="auth-form" id="request-form">
            <div class="field">
              <label for="reset-email">Email</label>
              <input id="reset-email" name="email" type="email" required />
            </div>
            <button class="button primary" type="submit">Send Reset Link</button>
            <p class="form-status" aria-live="polite"></p>
          </form>

          <form class="auth-form hidden" id="confirm-form">
            <div class="field">
              <label for="reset-token">Reset Token</label>
              <input id="reset-token" name="token" type="text" required placeholder="Paste the reset token here" />
            </div>
            <div class="field">
              <label for="new-password">New Password (min 6 characters)</label>
              <input id="new-password" name="password" type="password" minlength="6" required />
            </div>
            <button class="button primary" type="submit">Reset Password</button>
            <p class="form-status" aria-live="polite"></p>
          </form>

          <div id="reset-success" class="auth-success" hidden>
            <p>Password reset successful! You can now sign in with your new password.</p>
            <a class="button primary" href="/auth">Sign In</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <img src="/assets/nexa-mark.png" alt="" />
      <p>&copy; <span id="year"></span> NEXAStudios™ Music. All rights reserved.</p>
      <a href="https://www.youtube.com/@NEXAStudiosTMMusic" target="_blank" rel="noopener">YouTube</a>
      <a href="/contact">Contact</a>
    </footer>
    <script src="/script.js?v=12"></script>
  </body>
</html>
